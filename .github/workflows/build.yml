name: Build QueueLink.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --name QueueLink --icon icon.ico
          --add-data "index.html;."
          --hidden-import engineio.async_drivers.aiohttp
          --collect-submodules qrcode
          server.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QueueLink-windows
          path: dist/QueueLink.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QueueLink.exe
